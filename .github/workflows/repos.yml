name: Build repos data

on:
  schedule:
    # Une fois par jour, 04:17 UTC. Heure decalee pour eviter la minute pleine.
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-repos.mjs'
      - '.github/workflows/repos.yml'

permissions:
  contents: write

concurrency:
  group: repos-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build data/repos.json
        env:
          # Le token du runner suffit et monte la limite API a 1000 par heure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-repos.mjs --user infinition --out data/repos.json

      - name: Verifier que le JSON est exploitable
        run: |
          node -e "
            const d = require('./data/repos.json');
            if (!Array.isArray(d.repos) || d.repos.length === 0) {
              throw new Error('repos.json is empty, refusing to commit');
            }
            console.log(d.repos.length + ' repos, ' + d.total_stars + ' stars, ' + d.covers + ' covers');
          "

      - name: Commit si le contenu a change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/repos.json; then
            echo 'no change'
            exit 0
          fi
          git add data/repos.json
          git commit -m 'chore(data): refresh repos snapshot'
          git push
