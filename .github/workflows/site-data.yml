name: Build site data

# Resout ici ce que le navigateur allait chercher a chaque visite :
# la liste des repos, l'index des articles et de la KB, et ArtStation.
# L'API GitHub anonyme plafonne a soixante appels par heure, les pages
# tombaient donc en panne des qu'il y avait un peu de trafic.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'articles/**'
      - 'kb/**'
      - 'scripts/build-repos.mjs'
      - 'scripts/build-repos-svg.mjs'
      - 'scripts/build-logs.mjs'
      - 'scripts/build-social.mjs'
      - 'library/**'
      - 'photos/**'
      - 'scripts/build-papers.mjs'
      - 'scripts/build-library.mjs'
      - 'scripts/build-photos.mjs'
      - 'scripts/build-paper-assets.py'
      - 'scripts/build-artstation.mjs'
      - 'scripts/build-feed.mjs'
      - 'scripts/collect-artstation.py'
      - '.github/workflows/site-data.yml'

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build-logs.mjs date les articles avec git log, il lui faut
          # l'historique complet.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # npm ci installe exactement ce que dit le lockfile sans y toucher.
        # npm install le reecrivait pour les binaires natifs de sharp
        # (win32 en local, linux ici), ce qui laissait package-lock.json
        # modifie et non commite, et faisait echouer le "git pull --rebase"
        # plus bas ("You have unstaged changes").
        run: npm ci

      - name: Build data/repos.json
        env:
          # Le token du runner suffit et monte la limite API a 1000 par heure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-repos.mjs --user infinition --out data/repos.json

      - name: Build data/logs.json
        run: node scripts/build-logs.mjs --out data/logs.json

      - name: Build data/social.json
        # Abonnes Reddit et membres Discord des badges du portail.
        run: node scripts/build-social.mjs --out data/social.json

      - name: Build data/papers.json
        # Publications arXiv et preprints de la bibliotheque. Le script tient
        # tout seul le 429 d'arXiv, recopie les PDF des preprints sous
        # assets/papers et conserve le snapshot precedent en cas d'echec.
        run: node scripts/build-papers.mjs --out data/papers.json

      - name: Build data/library.json
        # Les rayons de textes markdown du dossier library/.
        run: node scripts/build-library.mjs --dir library --out data/library.json

      - name: Build data/photos.json
        # Vignettes et versions web des photos de photos/. Les originaux ne
        # sont jamais servis au visiteur, et une derivee deja calculee n'est
        # pas refaite : seul un fichier ajoute ou modifie est reencode.
        run: node scripts/build-photos.mjs --dir photos --out data/photos.json --assets assets/photos

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer les dependances Python
        # curl_cffi rejoue l'empreinte TLS de Chrome, seule facon d'obtenir
        # autre chose qu'un 403 d'ArtStation. pypdfium2 est le moteur PDF de
        # Chrome en roue precompilee, il rend les couvertures.
        run: pip install --disable-pip-version-check curl_cffi pypdfium2 pillow

      - name: Rendre les couvertures des publications
        # La premiere page de chaque PDF, et le resume des preprints hors
        # arXiv. Les images deja rendues ne sont jamais refaites.
        run: python scripts/build-paper-assets.py --papers data/papers.json --out-dir assets/papers

      - name: Collecter l'instantane ArtStation
        # En pratique Cloudflare refuse les adresses des runners GitHub, meme
        # avec l'empreinte TLS de Chrome : ce pas echoue presque toujours ici
        # et c'est attendu. build-artstation.mjs bascule alors sur le flux RSS,
        # qui n'ajoute que les creations encore inconnues sans jamais ecraser
        # ce que la derniere collecte complete avait ramene.
        # Pour rafraichir les compteurs, lancer "npm run artstation" en local.
        # Le repli sur echo evite une annotation rouge quotidienne sur un run
        # par ailleurs vert.
        run: >
          python scripts/collect-artstation.py infinition --out .artstation-raw.json
          || echo 'collecteur bloque par Cloudflare, le flux RSS prend le relais'

      - name: Build data/artstation.json
        run: node scripts/build-artstation.mjs --user infinition --raw .artstation-raw.json --out data/artstation.json

      - name: Build assets/repos-grid.svg
        run: node scripts/build-repos-svg.mjs --data data/repos.json --out assets/repos-grid.svg

      - name: Build feed.xml
        # Le flux RSS des textes du site. Il se construit apres les snapshots
        # puisqu'il les lit, et il refuse d'ecrire un flux vide.
        run: node scripts/build-feed.mjs --out feed.xml

      - name: Verifier que les JSON sont exploitables
        run: |
          node -e "
            const repos = require('./data/repos.json');
            if (!Array.isArray(repos.repos) || repos.repos.length === 0) {
              throw new Error('repos.json is empty, refusing to commit');
            }
            const logs = require('./data/logs.json');
            if (!Array.isArray(logs.articles) || logs.articles.length === 0) {
              throw new Error('logs.json has no article, refusing to commit');
            }
            console.log(repos.repos.length + ' repos, ' + repos.total_stars + ' stars, ' + repos.covers + ' covers');
            console.log(logs.articles.length + ' articles, ' + logs.artworks.length + ' artworks');
            const social = require('./data/social.json');
            if (!social.reddit || !social.discord) {
              throw new Error('social.json is incomplete, refusing to commit');
            }
            console.log('reddit ' + social.reddit.label + ', discord ' + social.discord.label);
            const papers = require('./data/papers.json');
            if (!Array.isArray(papers.papers) || papers.papers.length === 0) {
              throw new Error('papers.json is empty, refusing to commit');
            }
            console.log(papers.papers.length + ' papers, '
              + papers.papers.filter(p => p.cover).length + ' covers');
            const photos = require('./data/photos.json');
            console.log(photos.count + ' photos, ' + photos.tags.length + ' tags');
            const library = require('./data/library.json');
            console.log((library.shelves || [])
              .map(s => s.label + ': ' + s.count).join(', ') || 'library empty');
            const art = require('./data/artstation.json');
            if (!Array.isArray(art.artworks) || art.artworks.length === 0) {
              throw new Error('artstation.json is empty, refusing to commit');
            }
            console.log(art.artworks.length + ' artworks from ' + art.source);
            // Un seul caractere interdit et le flux est illisible pour tous
            // les agregateurs, sans que rien ne le signale sur le site.
            const feed = require('fs').readFileSync('feed.xml', 'utf8');
            const items = (feed.match(/<item>/g) || []).length;
            if (items === 0) throw new Error('feed.xml has no item, refusing to commit');
            if (/[\x00-\x08\x0B\x0C\x0E-\x1F\uFFFE\uFFFF]/.test(feed)) {
              throw new Error('feed.xml contains a character XML forbids');
            }
            console.log(items + ' items in feed.xml');
          "

      - name: Commit si le contenu a change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # git diff ignore les fichiers non suivis, donc un tout premier
          # snapshot passait pour "aucun changement" et n'etait jamais commite.
          if [ -z "$(git status --porcelain -- data/repos.json data/repos-summary.json data/logs.json data/social.json data/papers.json data/library.json data/photos.json data/artstation.json assets/repos-grid.svg assets/papers assets/photos feed.xml)" ]; then
            echo 'no change'
            exit 0
          fi
          git add data/repos.json data/repos-summary.json data/logs.json data/social.json data/papers.json data/library.json data/photos.json data/artstation.json assets/repos-grid.svg assets/papers assets/photos feed.xml
          git commit -m 'chore(data): refresh site snapshots'
          # Un outil de build peut laisser trainer une modif hors de cette
          # liste (ex: package-lock.json retouche par npm) ; on ne veut
          # jamais la commiter, et elle ferait echouer le merge ci-dessous.
          git checkout -- .
          # Ces fichiers sont entierement regeneres a chaque run, jamais
          # edites a la main : deux runs rapproches produisent deux versions
          # completes et independantes du meme snapshot, que git ne sait pas
          # fusionner ligne a ligne (rebase plantait avec un vrai conflit de
          # contenu). Le snapshot qu'on vient de construire est toujours le
          # plus a jour, donc on le garde tel quel en cas de conflit ; tout
          # changement upstream sur d'autres fichiers se fusionne normalement.
          git fetch origin main
          git merge -X ours --no-edit origin/main
          git push
