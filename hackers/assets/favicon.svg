<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Terminal prompt: reads as a shell at 16px, where a floppy turned to mush. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="6" fill="#050706" stroke="#35e07a" stroke-width="3"/>

  <!-- Chevron -->
  <path d="M14 20 L30 32 L14 44" fill="none" stroke="#35e07a" stroke-width="6"
        stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>

  <!-- Cursor -->
  <rect x="36" y="38" width="16" height="6" fill="#35e07a" filter="url(#glow)"/>

  <!-- Two dead pixels of magenta, because it is still the Gibson. -->
  <rect x="36" y="20" width="6" height="6" fill="#ff3df0"/>
  <rect x="46" y="20" width="6" height="6" fill="#2fe4ff"/>
</svg>
